name: USACallerLookup
description: A free, read-only JSON REST API over US phone-numbering data and FTC robocall complaint records. No API key or
  signup required; access is throttled at 60 requests/minute per IP. Data is sourced from FTC Do Not Call complaints and the
  NANPA registry and dedicated to the public domain under CC0.
